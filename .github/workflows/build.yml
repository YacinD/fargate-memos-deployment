name: Build and Push Image

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  ECR_REPO: ecs-memos
  IMAGE_TAG: v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          REPO=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}

          docker build \
            -f Dockerfile \
            -t "$REPO:${{ env.IMAGE_TAG }}" \
            -t "$REPO:${{ github.sha }}" \
            .

          docker push "$REPO:${{ env.IMAGE_TAG }}"
          docker push "$REPO:${{ github.sha }}"

      - run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }} and :${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"