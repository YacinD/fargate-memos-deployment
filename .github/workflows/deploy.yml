name: Terraform Deploy

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  TF_VERSION: "1.10.0"

jobs:
  bootstrap-plan:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.commits.*.modified), 'bootstrap/') ||
      contains(toJSON(github.event.commits.*.added), 'bootstrap/') ||
      contains(toJSON(github.event.commits.*.removed), 'bootstrap/')

    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    defaults:
      run:
        working-directory: bootstrap

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive

      - run: terraform init

      - run: terraform validate

      - id: plan
        run: |
          set +e
          terraform plan -out=tfplan -detailed-exitcode
          EXITCODE=$?
          set -e

          echo "exitcode=$EXITCODE" >> "$GITHUB_OUTPUT"

          terraform show -no-color tfplan > plan_output.txt

          if [ "$EXITCODE" -eq 1 ]; then
            exit 1
          fi

      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-terraform-plan
          path: |
            bootstrap/tfplan
            bootstrap/plan_output.txt
          retention-days: 14

      - if: always()
        run: |
          echo "### Bootstrap Terraform Plan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -c 60000 plan_output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  bootstrap-apply:
    needs: bootstrap-plan

    if: |
      needs.bootstrap-plan.outputs.plan_exitcode == '0' ||
      needs.bootstrap-plan.outputs.plan_exitcode == '2'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    defaults:
      run:
        working-directory: bootstrap

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-terraform-plan
          path: bootstrap

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

  build-after-bootstrap:
    needs: bootstrap-apply

    if: needs.bootstrap-apply.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          REPO=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}

          docker build \
            -f Dockerfile \
            -t "$REPO:${{ env.IMAGE_TAG }}" \
            -t "$REPO:${{ github.sha }}" \
            .

          docker push "$REPO:${{ env.IMAGE_TAG }}"
          docker push "$REPO:${{ github.sha }}"

      - run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }} and :${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  plan:
    needs:
      - bootstrap-apply
      - build-after-bootstrap

    if: |
      always() &&
      (
        needs.bootstrap-apply.result == 'success' ||
        (
          needs.bootstrap-apply.result == 'skipped' &&
          needs.build-after-bootstrap.result == 'skipped'
        )
      ) &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(toJSON(github.event.commits.*.modified), 'infra/') ||
        contains(toJSON(github.event.commits.*.added), 'infra/') ||
        contains(toJSON(github.event.commits.*.removed), 'infra/') ||
        needs.bootstrap-apply.result == 'success'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    defaults:
      run:
        working-directory: infra

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive

      - run: terraform init

      - run: terraform validate

      - uses: bridgecrewio/checkov-action@master
        with:
          directory: infra
          framework: terraform
          quiet: true
          soft_fail: true

      - id: plan
        run: |
          set +e
          terraform plan -out=tfplan -detailed-exitcode
          EXITCODE=$?
          set -e

          echo "exitcode=$EXITCODE" >> "$GITHUB_OUTPUT"

          terraform show -no-color tfplan > plan_output.txt

          if [ "$EXITCODE" -eq 1 ]; then
            exit 1
          fi

      - if: always()
        run: |
          echo "### Terraform Plan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -c 60000 plan_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            infra/tfplan
            infra/plan_output.txt
          retention-days: 14

  apply:
    needs: plan

    if: |
      needs.plan.outputs.plan_exitcode == '0' ||
      needs.plan.outputs.plan_exitcode == '2'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster memos-cluster \
            --service memos-task-service-luk8cbkx \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for ECS service
        run: |
          aws ecs wait services-stable \
            --cluster memos-cluster \
            --services memos-task-service-luk8cbkx \
            --region ${{ env.AWS_REGION }}

      - name: Health check
        run: |
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ecsv1.online || echo "000")
            echo "Attempt $i: HTTP $STATUS"

            if [ "$STATUS" -eq 200 ]; then
              echo "Healthy."
              exit 0
            fi

            sleep 15
          done

          echo "Health check failed after retries"
          exit 1

      - run: |
          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "https://ecsv1.online is live and healthy" >> "$GITHUB_STEP_SUMMARY"