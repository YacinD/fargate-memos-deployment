name: Terraform Deploy

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  TF_VERSION: "1.10.0"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: infra
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive

      - run: terraform init

      - run: terraform validate

      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false

      - id: plan
        run: |
          set +e
          terraform plan -out=tfplan -detailed-exitcode
          EXITCODE=$?
          set -e
          echo "exitcode=$EXITCODE" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan_output.txt
          exit $EXITCODE

      - if: always()
        run: |
          echo "### Terraform Plan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -c 60000 plan_output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            infra/tfplan
            infra/plan_output.txt
          retention-days: 14

  apply:
    needs: plan
    if: needs.plan.outputs.plan_exitcode == '0' || needs.plan.outputs.plan_exitcode == '2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra

      - run: terraform apply -auto-approve tfplan

      - run: |
          aws ecs wait services-stable \
            --cluster memos-cluster \
            --services memos-task-service-luk8cbkx \
            --region ${{ env.AWS_REGION }}

      - run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ecsv1.online || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "Healthy."
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after retries"
          exit 1

      - run: |
          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "https://ecsv1.online is live and healthy" >> "$GITHUB_STEP_SUMMARY"